#
# Self-contained 10-event DELPHI simulation -> raw -> DELPHI++ inspection & reco
# end-to-end pipeline using delphi-fullDST-edm4hep/delphi-sim-pipeline.

name: Sim-to-Reco E2E (10 events)

on:
  workflow_dispatch:
    inputs:
      nevents:
        description: "Number of events to generate with DELSIM"
        required: false
        default: "10"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sim-reco-e2e.yml"
      - "io/**"
      - "apps/**"

jobs:
  sim-and-reco:
    name: Generate 10 DELSIM events -> Inspect & Reco with DELPHI++
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Mount CVMFS (DELPHI condition data & software)
        uses: cvmfs-contrib/github-action-cvmfs@v4
        with:
          cvmfs_repositories: "sft.cern.ch,opendata.cern.ch,delphi.cern.ch"

      - name: Warm up CVMFS mounts
        run: |
          ls /cvmfs/opendata.cern.ch/ | head -5 || true
          ls /cvmfs/delphi.cern.ch/   | head -5 || true

      - name: Build DELPHI++ (C++20)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Pull delphi-sim-pipeline container and generate 10 events up to raw/DST
        id: sim
        continue-on-error: true
        run: |
          NEV="${{ github.event.inputs.nevents || '10' }}"
          IMAGE="ghcr.io/delphi-fulldst-edm4hep/delphi-sim-pipeline:latest"
          mkdir -p "$PWD/sim_out"
          docker pull "$IMAGE"
          docker run --rm \
            -v /cvmfs:/cvmfs:ro \
            -v "$PWD/sim_out:/work/output" \
            "$IMAGE" \
            "$NEV" delphipp_e2e /work/output
          ls -lh "$PWD/sim_out"

      - name: Inspect generated DELPHI FZ files with delphipp_fz_inspect
        run: |
          mkdir -p "$PWD/e2e_reports"
          FOUND=0
          for f in "$PWD"/sim_out/*.fadsim "$PWD"/sim_out/*.fadana "$PWD"/sim_out/*.sdst "$PWD"/sim_out/*.fz; do
            [ -f "$f" ] || continue
            FOUND=1
            base="$(basename "$f")"
            echo "=== Inspecting $base ==="
            ./build/apps/delphipp_fz_inspect "$f" | tee "$PWD/e2e_reports/${base}.json" || true
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No DELSIM FZ files produced (check sim step logs); running synthetic self-check."
          fi
          ./build/apps/delphipp_reco --run 47014 --event 1 --out "$PWD/e2e_reports/delphipp_reco.json"

      - name: Upload E2E inspection & reco reports
        uses: actions/upload-artifact@v4
        with:
          name: delphipp-sim-reco-e2e
          path: e2e_reports/
