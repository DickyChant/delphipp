#
# Self-contained 10-event DELPHI simulation -> raw (fadsim) + DST (fadana/sdst)
# -> DELPHI++ C++20 ZEBRA FZ parsing, reconstruction, CSV & HepMC3 export
# -> CERNLIB Fortran reference comparison E2E pipeline.
# No continue-on-error: every step must genuinely succeed and log verbose output.

name: Sim-to-Reco E2E (10 events)

on:
  workflow_dispatch:
    inputs:
      nevents:
        description: "Number of events to generate with DELSIM"
        required: false
        default: "10"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sim-reco-e2e.yml"
      - "io/**"
      - "dst/**"
      - "pipeline/**"
      - "apps/**"
      - "tools/fortran_fz_dump.f"
      - "tools/compare_fortran_cpp.py"

jobs:
  sim-and-reco:
    name: Generate 10 DELSIM events -> DELPHI++ C++20 Reco & Fortran Reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Mount CVMFS (DELPHI condition data & software)
        uses: cvmfs-contrib/github-action-cvmfs@v4
        with:
          cvmfs_repositories: "sft.cern.ch,opendata.cern.ch,delphi.cern.ch"

      - name: Warm up CVMFS mounts
        run: |
          ls -la /cvmfs/opendata.cern.ch/ | head -10 || true
          ls -la /cvmfs/delphi.cern.ch/   | head -10 || true

      - name: Build DELPHI++ (C++20)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Generate 10 real DELPHI events up to raw (fadsim) + DST (DELPHI_ZIP=off)
        run: |
          set -euo pipefail
          NEV="${{ github.event.inputs.nevents || '10' }}"
          PYTHIA_NEV=$((NEV + 5))
          IMAGE="docker.io/jingyucms/delphi-sim:latest"
          mkdir -p "$PWD/sim_out"
          chmod 777 "$PWD/sim_out"

          echo "=== Pulling public DELPHI simulation image: $IMAGE ==="
          docker pull "$IMAGE"

          echo "=== Running Pythia8 ($PYTHIA_NEV evts) -> DELSIM/DELANA ($NEV evts, DELPHI_ZIP=off) ==="
          docker run --rm \
            -v /cvmfs:/cvmfs:ro \
            -v "$PWD/sim_out:/work/output" \
            --entrypoint bash \
            "$IMAGE" \
            -c "
              set -euo pipefail
              export PATH='/root/.local/bin:/root/bin:/delphi/releases/almalinux-9-x86_64/latest/scripts:/delphi/scripts:/delphi/releases/almalinux-9-x86_64/latest/bin:/delphi/releases/almalinux-9-x86_64/latest/cern/pro/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:.'
              export OPGS_RUN_TIME='/delphi/releases/almalinux-9-x86_64/latest/delgra/run_time'
              export DELPHI_RELEASE='latest'
              export CERN_ROOT='/delphi/releases/almalinux-9-x86_64/latest/cern/pro'
              export DELPHI_PAM='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/src/car'
              export DELPHI_DDB_BIN='/delphi/releases/almalinux-9-x86_64/latest/ddb/bin'
              export DELPHI='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018'
              export GROUPPATH='/delphi/releases/almalinux-9-x86_64/latest/bin'
              export CERN_PAM='/delphi/releases/almalinux-9-x86_64/latest/cern/pro/src/car'
              export DELPHI_LIB='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/lib'
              export DES_HOME='/delphi/releases/almalinux-9-x86_64/latest/evserv'
              export CERN='/delphi/releases/almalinux-9-x86_64/latest/cern'
              export CERN_LIB='/delphi/releases/almalinux-9-x86_64/latest/cern/pro/lib'
              export DELPHI_BATCAVE='/delphi/pdl'
              export OPENPHIGS='/delphi/releases/almalinux-9-x86_64/latest/openphigs'
              export DELPHI_BLKD='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/blkd'
              export DELPHI_ZIP='off'
              export DELPHI_XRD=''
              export DELPHI_DATA_ROOT='/eos/opendata/delphi'
              export GRA_PLACE='/delphi/releases/almalinux-9-x86_64/latest/delgra'
              export DELPHI_CRA='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/src/car'
              export DELSIM_ROOT='/delphi/releases/almalinux-9-x86_64/latest/simana'
              export DELPHI_PATH='/delphi/releases/almalinux-9-x86_64/latest/bin'
              export DELPHI_DAT='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/dat'
              export GROUP_DIR='/delphi/releases/almalinux-9-x86_64/latest'
              export DELPHI_DDB='/eos/opendata/delphi/condition-data'
              export DELPHI_DDB_DIR='/delphi/releases/almalinux-9-x86_64/latest/ddb'
              export ADDLIB='/delphi/releases/almalinux-9-x86_64/latest/dstana/161018/blkd/delblkd.o'
              export DELPHI_INSTALL_DIR='/delphi'
              export DELPHI_BIN='/delphi/releases/almalinux-9-x86_64/latest/bin'
              export PYTHIA8DATA='/usr/share/Pythia8/xmldoc'
              export LD_LIBRARY_PATH='/usr/lib64:/lib64'

              cd /work
              ./pythia8_generate ${PYTHIA_NEV}
              mv fort.26 my_events.fadgen
              ls -lh my_events.fadgen

              runsim -VERSION v94c -LABO CERN -NRUN 47014 -EBEAM 45.625 -NEVMAX ${NEV} -gext my_events.fadgen

              echo '=== Files produced in /work ==='
              ls -lh simana.* 2>&1 || true
              for f in simana.fadsim simana.fadana simana.sdst; do
                if [ -f \"\$f\" ]; then
                  cp \"\$f\" \"/work/output/\$f\"
                fi
              done
            "

          echo "=== Output files collected in sim_out/ ==="
          ls -lh "$PWD/sim_out"
          test -s "$PWD/sim_out/simana.fadsim" || test -s "$PWD/sim_out/simana.sdst"

      - name: Inspect and reconstruct real DELSIM raw & DST FZ files with DELPHI++ (C++20)
        run: |
          set -euo pipefail
          mkdir -p "$PWD/e2e_reports"

          INSPECTED=0
          for f in "$PWD"/sim_out/simana.fadsim "$PWD"/sim_out/simana.fadana "$PWD"/sim_out/simana.sdst; do
            [ -f "$f" ] || continue
            INSPECTED=$((INSPECTED + 1))
            base="$(basename "$f")"
            echo "========================================"
            echo "DELPHI++ Inspection + C++20 Reco: $base ($(stat -c%s "$f") bytes)"
            echo "========================================"
            ./build/apps/delphipp_fz_inspect "$f" | tee "$PWD/e2e_reports/${base}_inspect.json"
            ./build/apps/delphipp_reco \
              --input "$f" \
              --verbose \
              --out "$PWD/e2e_reports/${base}_reco.json" \
              --summary-json "$PWD/e2e_reports/${base}_summary.json" \
              --csv-out "$PWD/e2e_reports/${base}_dst.csv" \
              --hepmc-out "$PWD/e2e_reports/${base}.hepmc3"

            if [ -s "$PWD/e2e_reports/${base}_dst.csv" ]; then
              echo "--- Preview ${base}_dst.csv (first 25 lines) ---"
              head -n 25 "$PWD/e2e_reports/${base}_dst.csv"
            fi
            if [ -s "$PWD/e2e_reports/${base}.hepmc3" ]; then
              echo "--- Preview ${base}.hepmc3 (first 25 lines) ---"
              head -n 25 "$PWD/e2e_reports/${base}.hepmc3"
            fi
          done
          test "$INSPECTED" -gt 0

          echo "=== Synthetic 94D benchmark check ==="
          ./build/apps/delphipp_reco \
            --run 47014 \
            --event 1 \
            --verbose \
            --out "$PWD/e2e_reports/delphipp_synthetic_reco.json" \
            --csv-out "$PWD/e2e_reports/delphipp_synthetic.csv" \
            --hepmc-out "$PWD/e2e_reports/delphipp_synthetic.hepmc3"

      - name: Run CERNLIB Fortran reference dump on real DELSIM files
        run: |
          set -euo pipefail
          IMAGE="docker.io/jingyucms/delphi-sim:latest"
          docker run --rm \
            -v /cvmfs:/cvmfs:ro \
            -v "$PWD/sim_out:/work/output" \
            -v "$PWD/tools:/work/delphipp_tools:ro" \
            --entrypoint bash \
            "$IMAGE" \
            -c '
              set -euo pipefail
              export CERN_ROOT="/delphi/releases/almalinux-9-x86_64/latest/cern/pro"
              export CERN_LIB="${CERN_ROOT}/lib"
              export PATH="${CERN_ROOT}/bin:/usr/local/bin:/usr/bin:/bin"
              export LD_LIBRARY_PATH="/usr/lib64:/lib64"

              if ! command -v gfortran >/dev/null 2>&1; then
                echo "Installing gcc-gfortran..."
                dnf install -y -q gcc-gfortran
              fi
              echo "gfortran: $(command -v gfortran)"
              ls -la "${CERN_LIB}" || true

              gfortran -O2 -std=legacy -fallow-argument-mismatch \
                /work/delphipp_tools/fortran_fz_dump.f -o /work/fortran_fz_dump \
                -L"${CERN_LIB}" -lpacklib -lkernlib -lm -ldl \
              || gfortran -O2 -std=legacy -fallow-argument-mismatch -no-pie \
                /work/delphipp_tools/fortran_fz_dump.f -o /work/fortran_fz_dump \
                -L"${CERN_LIB}" -lpacklib -lkernlib -lm -ldl \
              || gfortran -O2 -std=legacy -fallow-argument-mismatch \
                /work/delphipp_tools/fortran_fz_dump.f -o /work/fortran_fz_dump \
                $(cernlib packlib)

              for f in simana.fadsim simana.sdst; do
                if [ -f "/work/output/$f" ]; then
                  echo "=== Running Fortran CERNLIB FZIN on $f ==="
                  /work/fortran_fz_dump "/work/output/$f" | tee "/work/output/fortran_${f}.txt"
                fi
              done
            '
          mkdir -p "$PWD/e2e_reports"
          cp "$PWD"/sim_out/fortran_*.txt "$PWD/e2e_reports/" 2>/dev/null || true

      - name: Cross-check CERNLIB Fortran vs DELPHI++ C++20
        run: |
          set -euo pipefail
          CHECKED=0
          for base in simana.fadsim simana.sdst; do
            ftxt="$PWD/e2e_reports/fortran_${base}.txt"
            csum="$PWD/e2e_reports/${base}_summary.json"
            if [ -f "$ftxt" ] && [ -f "$csum" ]; then
              CHECKED=$((CHECKED + 1))
              python3 tools/compare_fortran_cpp.py --fortran "$ftxt" --cpp "$csum" --label "$base"
            fi
          done
          test "$CHECKED" -gt 0

      - name: Upload E2E inspection, Fortran reference, CSV & HepMC3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delphipp-sim-reco-e2e
          path: e2e_reports/
