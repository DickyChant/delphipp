name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "README.md"
      - "docs/**"
      - "core/**"
      - "db/**"
      - "io/**"
      - "reco/**"
      - "dst/**"
      - "pipeline/**"
      - "apps/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen + doxygen-awesome-css HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz git

      - name: Fetch doxygen-awesome-css v2.3.4
        run: |
          rm -rf docs/doxygen-awesome-css
          git clone --depth 1 --branch v2.3.4 https://github.com/jothepro/doxygen-awesome-css.git docs/doxygen-awesome-css
          ls -la docs/doxygen-awesome-css

      - name: Generate HTML documentation
        run: |
          doxygen docs/Doxyfile
          touch docs/_build/html/.nojekyll
          test -s docs/_build/html/index.html
          grep -q "doxygen-awesome.css" docs/_build/html/index.html
          echo "Generated HTML files: $(find docs/_build/html -type f | wc -l)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: delphipp-docs-html
          path: docs/_build/html/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
